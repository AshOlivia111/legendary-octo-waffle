<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ 中国旅游攻略地图 · 省级</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  body {
    background: linear-gradient(160deg,#0a1628,#0f2438 60%,#0a1a2f);
    min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:1.5rem;
  }
  .map-container {
    background: rgba(16,42,67,.85);
    backdrop-filter: blur(8px);
    border-radius: 2rem; padding: 1.8rem;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.9),
                0 0 0 1px rgba(120,180,255,.08);
    max-width: 1100px; width:100%;
  }
  .map-header { text-align:center; margin-bottom:1.2rem; }
  .map-header h1 {
    color:#eaf3ff; font-size:1.7rem; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:.5rem;
  }
  .map-header p { color:#7fa6c9; font-size:.9rem; margin-top:.4rem; }

  #mapWrap {
    background: radial-gradient(circle at 50% 45%,#0e2038,#081422);
    border-radius: 1.2rem;
    box-shadow: inset 0 0 40px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .china-map { display:block; width:100%; height:auto; }

  .province {
    fill:#2b5a7a; stroke:#0d1f30; stroke-width:0.6;
    cursor:pointer;
    transition: fill .2s, stroke .2s, filter .2s;
  }
  .province:hover {
    fill:#ffd966; stroke:#fff; stroke-width:1.2;
    filter: drop-shadow(0 0 8px rgba(255,225,120,.9));
  }
  .province.has-guide { fill:#4d8b9c; }
  .province.has-guide:hover { fill:#ffd966; }
  .nanhai-line { fill:none; stroke:#3a6a8a; stroke-width:0.8;
    stroke-dasharray:4 3; pointer-events:none; }

  /* 弹窗样式 */
  .preview-overlay {
    position:fixed; inset:0; background:rgba(3,10,20,.7);
    backdrop-filter: blur(6px);
    display:none; align-items:center; justify-content:center;
    padding:1.2rem; z-index:900;
  }
  .preview-overlay.active { display:flex; }
  .preview-card {
    background:#0f2135; border-radius:1.5rem;
    max-width:360px; width:100%; overflow:hidden;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,1);
    animation: pop .25s cubic-bezier(.2,.8,.3,1);
    cursor:pointer; transition: transform .2s;
  }
  .preview-card:hover { transform: translateY(-4px) scale(1.02); }
  @keyframes pop { from { transform: scale(.94); opacity:0; } to { transform: scale(1); opacity:1; } }
  .preview-cover {
    height:160px; background-size:cover; background-position:center;
    position:relative; display:flex; align-items:flex-end;
    padding:1rem; background-color:#1a3a55;
  }
  .preview-cover::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(to top, rgba(15,33,53,1), rgba(15,33,53,.3) 60%, transparent);
  }
  .preview-cover h3 {
    position:relative; z-index:2; color:#fff;
    font-size:1.4rem; font-weight:700;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
    display:flex; align-items:center; gap:.4rem;
  }
  .preview-body { padding: 1rem 1.2rem 1.2rem; }
  .preview-desc {
    color:#9fc0dd; font-size:.88rem; line-height:1.6; margin-bottom:.9rem;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .preview-cta {
    display:flex; align-items:center; justify-content:space-between;
    color:#7fd0ff; font-size:.9rem; font-weight:500;
  }
  .preview-cta .arrow { transition: transform .2s; }
  .preview-card:hover .arrow { transform: translateX(4px); }

  .detail-overlay {
    position:fixed; inset:0; background:#081422;
    display:none; z-index:1000; overflow-y:auto;
  }
  .detail-overlay.active { display:block; }
  .detail-page {
    max-width:760px; margin:0 auto; padding-bottom:3rem;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .detail-hero {
    height:280px; background-size:cover; background-position:center;
    position:relative; display:flex; align-items:flex-end;
    padding:1.8rem; background-color:#1a3a55;
  }
  .detail-hero::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(to top, #081422 5%, rgba(8,20,34,.4) 50%, rgba(8,20,34,.2));
  }
  .detail-hero h1 {
    position:relative; z-index:2; color:#fff;
    font-size:2.2rem; font-weight:700;
    text-shadow:0 2px 16px rgba(0,0,0,.8);
    display:flex; align-items:center; gap:.6rem;
  }
  .detail-close {
    position:fixed; top:1rem; right:1rem; z-index:1100;
    background:rgba(10,25,40,.8); border:none; color:#cfe3f7;
    width:42px; height:42px; border-radius:50%;
    font-size:1.3rem; cursor:pointer; backdrop-filter:blur(6px);
    transition:.2s;
  }
  .detail-close:hover { background:#2e5b80; color:#fff; transform:rotate(90deg); }
  .detail-body { padding: 1.6rem 1.8rem; }
  .detail-intro {
    color:#b8d2e8; font-size:1rem; line-height:1.8;
    margin-bottom:1.6rem; padding-bottom:1.2rem;
    border-bottom:1px solid #1e3a55;
  }
  .section-title {
    display:flex; align-items:center; gap:.6rem;
    font-size:1.15rem; font-weight:600; color:#fff;
    margin: 1.8rem 0 1rem;
  }
  .section-title .bar {
    width:4px; height:20px; border-radius:4px;
    background: linear-gradient(#4fa3e3,#7fd0ff);
  }
  .itinerary { position:relative; padding-left:1.6rem; }
  .itinerary::before {
    content:''; position:absolute; left:6px; top:8px; bottom:8px;
    width:2px; background: linear-gradient(#2a5a80,#1d3a55);
  }
  .day-item { position:relative; margin-bottom:1.2rem; }
  .day-item::before {
    content:''; position:absolute; left:-1.6rem; top:6px;
    width:12px; height:12px; border-radius:50%;
    background:#4fa3e3; border:2px solid #0f2135;
    box-shadow:0 0 0 2px #2a5a80;
  }
  .day-label { color:#7fd0ff; font-weight:600; font-size:.9rem; margin-bottom:.25rem; }
  .day-text { color:#c5dcef; font-size:.9rem; line-height:1.6; }
  .spot-list {
    display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
    gap:1rem;
  }
  .spot-item {
    background:#122b42; border-radius:1rem;
    overflow:hidden; border:1px solid #1d3a55;
    transition:.25s;
  }
  .spot-item:hover {
    border-color:#3f7ba8; transform:translateY(-3px);
    box-shadow:0 12px 24px -10px rgba(0,0,0,.7);
  }
  .spot-img { height:120px; background-size:cover; background-position:center; background-color:#1a3a55; }
  .spot-info { padding:.8rem .9rem 1rem; }
  .spot-info .name { color:#e6f2ff; font-weight:600; font-size:.95rem; margin-bottom:.3rem; }
  .spot-info .desc { color:#8fb2ce; font-size:.8rem; line-height:1.5; margin-bottom:.5rem; }
  .spot-meta { display:flex; gap:.5rem; flex-wrap:wrap; }
  .spot-meta span {
    font-size:.72rem; color:#9fc0dd;
    background:#0f2135; padding:.2rem .55rem;
    border-radius:1rem; border:1px solid #1d3a55;
  }
  .food-tags { display:flex; flex-wrap:wrap; gap:.6rem; }
  .food-tag {
    background: linear-gradient(135deg,#1e4060,#2a5a80);
    color:#cfe8ff; font-size:.88rem;
    padding:.45rem 1rem; border-radius:2rem;
    border:1px solid #2f6490;
  }
  .tips-box {
    background: rgba(255,200,80,.08);
    border-left:3px solid #f0b840;
    border-radius:.6rem; padding:1rem 1.2rem;
    color:#ffe6b0; font-size:.9rem; line-height:1.8;
  }
  .tips-box li { margin-left:1rem; margin-bottom:.3rem; }
  .detail-footer {
    display:flex; gap:.8rem; flex-wrap:wrap;
    margin-top:1.8rem; padding-top:1.2rem;
    border-top:1px solid #1e3a55;
  }
  .info-chip {
    background:#122b42; border:1px solid #1d3a55;
    border-radius:2rem; padding:.4rem 1rem;
    font-size:.82rem; color:#9fc0dd;
  }
  #toast {
    position:fixed; left:50%; bottom:2rem; transform:translateX(-50%);
    background:rgba(20,45,70,.95); color:#cfe3f7;
    padding:.6rem 1.2rem; border-radius:2rem; font-size:.9rem;
    border:1px solid #2a5a80; z-index:2000;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
    opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:600px) {
    .map-container { padding:1rem; }
    .map-header h1 { font-size:1.25rem; }
    .detail-hero { height:200px; }
    .detail-hero h1 { font-size:1.5rem; }
    .detail-body { padding:1.2rem; }
    .spot-list { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="map-container">
  <div class="map-header">
    <h1>🗺️ 中国旅游攻略地图</h1>
    <p>点击省份 · 预览 · 查看详细攻略</p>
  </div>
  <div id="mapWrap">
    <div style="padding:3rem;text-align:center;color:#7fa6c9;">正在加载中国地图...</div>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-card" id="previewCard">
    <div class="preview-cover" id="previewCover"><h3 id="previewTitle"></h3></div>
    <div class="preview-body">
      <div class="preview-desc" id="previewDesc"></div>
      <div class="preview-cta"><span>查看详细攻略</span><span class="arrow">→</span></div>
    </div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <button class="detail-close" id="detailClose">✕</button>
  <div class="detail-page" id="detailPage"></div>
</div>

<div id="toast"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
/* 攻略数据 */
const regionData = {
  '北京市': {
    name: '北京', emoji: '🏯',
    cover: 'https://picsum.photos/id/1015/900/500',
    preview: '古都新貌，故宫、长城、胡同与烤鸭。',
    intro: '北京是中国的首都，拥有 3000 多年建城史和 800 多年建都史。',
    itinerary: [
      { day: 'Day 1', text: '天安门广场 → 故宫 → 景山公园看日落。' },
      { day: 'Day 2', text: '八达岭长城一日游。' }
    ],
    spots: [
      { name: '故宫', desc: '明清两代皇宫', img: 'https://picsum.photos/id/1015/400/250', time: '半天', ticket: '约60元' }
    ],
    foods: ['北京烤鸭', '炸酱面', '涮羊肉'],
    tips: ['故宫需提前 7 天官网预约', '地铁出行最方便'],
    info: { best: '4-5月 / 9-10月', lang: '普通话', currency: '人民币' }
  },
  '广东省': {
    name: '广东', emoji: '🍵',
    cover: 'https://picsum.photos/id/1016/900/500',
    preview: '早茶、粤菜、海岸线与岭南文化。',
    intro: '广东是中国南方的经济大省，也是美食天堂。',
    itinerary: [{ day: 'Day 1', text: '广州：陈家祠 → 上下九 → 珠江夜游。' }],
    spots: [
      { name: '广州塔', desc: '小蛮腰地标', img: 'https://picsum.photos/id/1018/400/250', time: '2小时', ticket: '约150元' }
    ],
    foods: ['早茶', '烧鹅', '肠粉'],
    tips: ['早茶一般上午 6-11 点', '夏季湿热注意防晒'],
    info: { best: '10月-次年3月', lang: '普通话/粤语', currency: '人民币' }
  },
  '四川省': {
    name: '四川', emoji: '🐼',
    cover: 'https://picsum.photos/id/1019/900/500',
    preview: '火锅、熊猫、九寨沟与雪山。',
    intro: '四川是美食与自然景观的宝库。',
    itinerary: [{ day: 'Day 1', text: '成都：宽窄巷子 → 锦里 → 火锅。' }],
    spots: [
      { name: '大熊猫基地', desc: '看熊猫最佳地点', img: 'https://picsum.photos/id/1015/400/250', time: '半天', ticket: '约55元' }
    ],
    foods: ['火锅', '串串香', '担担面'],
    tips: ['九寨沟需提前订票', '高原地区注意防晒'],
    info: { best: '3-5月 / 9-11月', lang: '普通话/四川话', currency: '人民币' }
  }
};

/* 渲染 */
const width = 960, height = 720;
const mapWrap = document.getElementById('mapWrap');

const svg = d3.select('#mapWrap')
  .html('')
  .append('svg')
  .attr('class', 'china-map')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .attr('preserveAspectRatio', 'xMidYMid meet');

d3.json('./china-provinces.json').then(china => {
  // 过滤：只保留省级行政区
  const features = china.features.filter(f => {
    if (!f.properties.name) return false;
    return true;
  });

  // 关键：用 fitSize 自动适应，不管数据多大都会自动缩放
  const collection = { type: 'FeatureCollection', features: features };
  const projection = d3.geoMercator().fitSize([width - 40, height - 40], collection);
  const path = d3.geoPath().projection(projection);

  // 绘制省份
  svg.append('g')
    .selectAll('path')
    .data(features)
    .join('path')
    .attr('class', d => {
      const name = d.properties.name;
      return 'province' + (regionData[name] ? ' has-guide' : '');
    })
    .attr('d', path)
    .on('click', (event, d) => {
      const name = d.properties.name;
      if (regionData[name]) {
        openPreview(name);
      } else {
        showToast(`${name} 暂无攻略`);
      }
    });

  // 南海诸岛虚线
  const nanhai = china.features.filter(f =>
    !f.properties.name && String(f.properties.adcode).includes('JD')
  );
  if (nanhai.length) {
    svg.append('g')
      .selectAll('path')
      .data(nanhai)
      .join('path')
      .attr('class', 'nanhai-line')
      .attr('d', path);
  }

}).catch(err => {
  console.error(err);
  mapWrap.innerHTML = '<div style="padding:3rem;text-align:center;color:#ff9e9e;">地图加载失败，请检查 china-provinces.json</div>';
});

/* 预览弹窗 */
const previewOverlay = document.getElementById('previewOverlay');
const previewCard    = document.getElementById('previewCard');
const previewCover   = document.getElementById('previewCover');
const previewTitle   = document.getElementById('previewTitle');
const previewDesc    = document.getElementById('previewDesc');

let currentKey = null;

function openPreview(key) {
  const data = regionData[key];
  if (!data) return;
  currentKey = key;
  previewCover.style.backgroundImage = `url('${data.cover}')`;
  previewTitle.innerHTML = `<span>${data.emoji}</span>${data.name}`;
  previewDesc.textContent = data.preview || data.intro;
  previewOverlay.classList.add('active');
}

previewCard.addEventListener('click', () => {
  if (!currentKey) return;
  previewOverlay.classList.remove('active');
  openDetail(currentKey);
});

previewOverlay.addEventListener('click', e => {
  if (e.target === previewOverlay) previewOverlay.classList.remove('active');
});

/* 详情页 */
const detailOverlay = document.getElementById('detailOverlay');
const detailPage    = document.getElementById('detailPage');
const detailClose   = document.getElementById('detailClose');

function openDetail(key) {
  const data = regionData[key];
  if (!data) return;

  const itineraryHTML = data.itinerary.map(d => `
    <div class="day-item">
      <div class="day-label">${d.day}</div>
      <div class="day-text">${d.text}</div>
    </div>
  `).join('');

  const spotsHTML = data.spots.map(s => `
    <div class="spot-item">
      <div class="spot-img" style="background-image:url('${s.img || data.cover}')"></div>
      <div class="spot-info">
        <div class="name">${s.name}</div>
        <div class="desc">${s.desc}</div>
        <div class="spot-meta">
          ${s.time ? `<span>⏱ ${s.time}</span>` : ''}
          ${s.ticket ? `<span>🎫 ${s.ticket}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  const foodsHTML = data.foods.map(f => `<span class="food-tag">${f}</span>`).join('');
  const tipsHTML  = data.tips.map(t => `<li>${t}</li>`).join('');

  detailPage.innerHTML = `
    <div class="detail-hero" style="background-image:url('${data.cover}')">
      <h1><span>${data.emoji}</span>${data.name}</h1>
    </div>
    <div class="detail-body">
      <div class="detail-intro">${data.intro}</div>

      <div class="section-title"><span class="bar"></span>🗓️ 推荐行程</div>
      <div class="itinerary">${itineraryHTML}</div>

      <div class="section-title"><span class="bar"></span>📍 必去景点</div>
      <div class="spot-list">${spotsHTML}</div>

      <div class="section-title"><span class="bar"></span>🍜 特色美食</div>
      <div class="food-tags">${foodsHTML}</div>

      <div class="section-title"><span class="bar"></span>💡 旅行贴士</div>
      <div class="tips-box"><ul>${tipsHTML}</ul></div>

      <div class="detail-footer">
        <span class="info-chip">🗓️ 最佳季节：${data.info.best}</span>
        <span class="info-chip">🗣️ 语言：${data.info.lang}</span>
        <span class="info-chip">💰 货币：${data.info.currency}</span>
      </div>
    </div>
  `;

  detailOverlay.classList.add('active');
  detailOverlay.scrollTop = 0;
}

detailClose.addEventListener('click', () => {
  detailOverlay.classList.remove('active');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    previewOverlay.classList.remove('active');
    detailOverlay.classList.remove('active');
  }
});

/* 轻提示 */
const toast = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}
</script>

</body>
</html>
